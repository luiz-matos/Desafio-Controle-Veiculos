services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: desafio_veiculos
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - desafio-veiculos-dados:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  desafio-veiculos-dados:
