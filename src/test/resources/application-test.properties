spring.application.name=desafio-veiculos

# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# AwesomeAPI Configuration
awesome.api.url=https://economia.awesomeapi.com.br/json/last/USD-BRL
frankfurter.api.url=https://api.frankfurter.app/latest?from=USD&to=BRL