spring.application.name=desafio-veiculos

# Banco: padrão para o compose.yaml, trocado por variável de ambiente fora dele
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/desafio_veiculos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Redis, usado como cache da cotação do dólar
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Esquema criado pelo Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.jpa.open-in-view=false

# Segredo que assina os tokens: o padrão serve só para rodar localmente
jwt.secret=${JWT_SECRET:segredo-local-de-desenvolvimento-com-pelo-menos-32-bytes}

# APIs de cotação do dólar: a AwesomeAPI primeiro, a Frankfurter quando ela falha
awesome.api.url=https://economia.awesomeapi.com.br/json/last/USD-BRL
frankfurter.api.url=https://api.frankfurter.dev/v1/latest?from=USD&to=BRL
