databaseChangeLog:
  - changeSet:
      id: 01-create-table-veiculos
      author: luizmatosdev
      changes:
        - createTable:
            tableName: veiculos
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: veiculo
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: marca
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: ano
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: descricao
                  type: TEXT
              - column:
                  name: deletado
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: valor
                  type: DECIMAL(15,2)